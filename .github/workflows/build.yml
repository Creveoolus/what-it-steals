name: Build WhatItSteals

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
            ext: .exe
          - os: ubuntu-latest
            name: linux
            ext: ""
          - os: macos-latest
            name: macos
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build
        run: pyinstaller --onefile --noconsole --name whatitsteals-${{ matrix.name }} whatitsteals.py

      - name: Smoke test (CLI mode)
        if: matrix.name != 'windows'
        run: ./dist/whatitsteals-${{ matrix.name }} --cli | head -5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatitsteals-${{ matrix.name }}
          path: dist/whatitsteals-${{ matrix.name }}${{ matrix.ext }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
